<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <title>SpasiZalogaj</title><link rel="stylesheet" href="style.css"></head>
<body><header><b>SpasiZalogaj</b><span><a href="reservations.html">My reservations</a><a href="pay.html" id="c"></a><button id="o">Logout</button></span></header>
<input id="q" placeholder="Search products...">
<div id="g" class="grid"></div>
<script>
    let d=[],cart=JSON.parse(localStorage.cart||'[]');const e=s=>new Option(s).innerHTML;
    const upd=()=>{c.textContent='Cart ('+cart.reduce((n,x)=>n+x.qty,0)+')';localStorage.cart=JSON.stringify(cart)};
    const show=()=>g.innerHTML=d.filter(p=>p.name.toLowerCase().includes(q.value.toLowerCase())).map(p=>`<div class="card"><img src="${e(p.photo||'')}"><h3>${e(p.name)}</h3><p>${e(p.store)}</p><p><s>${p.price}€</s> <b>${p.salePrice!=null?p.salePrice+'€':'Donation'}</b></p><small>Left: ${p.available} · Expires: ${e(p.expires)}</small>${p.salePrice!=null?`<button data-id="${p.id}">Reserve</button>`:''}</div>`).join('');
    g.onclick=ev=>{const id=ev.target.dataset.id;if(!id)return;const p=d.find(x=>x.id==id),x=cart.find(x=>x.id==id);x?x.qty<p.available&&x.qty++:cart.push({id:p.id,name:p.name,price:p.salePrice,qty:1});upd()};
    q.oninput=show;
    o.onclick=()=>fetch('/api/logout',{method:'POST'}).then(()=>location='index.html');
    fetch('/api/products').then(r=>r.ok?r.json():Promise.reject(location='index.html')).then(j=>{d=j;show()});
    upd();
</script></body></html>
