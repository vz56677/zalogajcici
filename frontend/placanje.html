<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Payment</title><link rel="stylesheet" href="style.css"></head>
<body><header><b>SpasiZalogaj</b><a href="main.html">Back</a></header>
<form id="f" class="card">
    <h2>Payment</h2>
    <div id="l"></div><b id="tot"></b>
    <label><input type="radio" name="payment" value="PAYPAL" checked> PayPal</label>
    <label><input type="radio" name="payment" value="CARD"> Credit card</label>
    <div class="cd">
        <input name="holder" placeholder="Name on card" autocomplete="cc-name">
        <input name="number" placeholder="Card number" inputmode="numeric" autocomplete="cc-number" maxlength="19">
        <input name="exp" placeholder="MM/YY" autocomplete="cc-exp" maxlength="5">
        <input name="cvv" placeholder="CVV" inputmode="numeric" autocomplete="cc-csc" maxlength="4">
    </div>
    <button>Pay</button><p id="m"></p>
</form>
<script>
    const cart=JSON.parse(localStorage.cart||'[]'),e=s=>new Option(s).innerHTML;
    const draw=()=>{l.innerHTML=cart.map((x,i)=>`<p>${e(x.name)} × ${x.qty} <b>${(x.price*x.qty).toFixed(2)} €</b> <a href="#" data-i="${i}">Remove</a></p>`).join('')||'<p>Cart is empty.</p>';tot.textContent='Total: '+cart.reduce((s,x)=>s+x.price*x.qty,0).toFixed(2)+' €';localStorage.cart=JSON.stringify(cart)};
    l.onclick=ev=>{const i=ev.target.dataset.i;if(i){ev.preventDefault();cart.splice(i,1);draw()}};
    f.onchange=()=>f.className='card'+(f.payment.value=='CARD'?' reg':'');
    f.onsubmit=async ev=>{ev.preventDefault();if(!cart.length)return;
        const r=await fetch('/api/reservations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({items:cart.map(({id,qty})=>({id,qty})),...Object.fromEntries(new FormData(f))})});
        if(r.ok){localStorage.removeItem('cart');location='reservations.html'}else m.textContent=await r.text()};
    draw();
</script></body></html>
