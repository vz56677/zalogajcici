<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <title>SpasiZalogaj</title><link rel="stylesheet" href="style.css"></head>
<body><form id="f" class="card">
    <h2 id="t">Login</h2>
    <input name="username" placeholder="Username" required>
    <input name="email" type="email" placeholder="Email" class="r">
    <input name="password" type="password" placeholder="Password" required>
    <select name="type" class="r"><option value="KUPAC">Customer</option><option value="DONATOR">Charity</option><option value="PRODAVAC">Seller</option></select>
    <button>Submit</button>
    <a href="/oauth2/authorization/google">Sign in with Google</a>
    <a href="#" id="s">Need an account? Register</a>
    <p id="m"></p></form>
<script>
    let reg=0;
    s.onclick=e=>{e.preventDefault();reg=!reg;f.className='card'+(reg?' reg':'');t.textContent=reg?'Register':'Login';s.textContent=reg?'Have an account? Login':'Need an account? Register';f.email.required=reg};
    f.onsubmit=async e=>{e.preventDefault();
        const r=await fetch('/api/'+(reg?'register':'login'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(f)))});
        r.ok?location='main.html':m.textContent=await r.text()};
</script></body></html>
